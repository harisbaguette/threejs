<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>시오사이 — 수정 전후</title>
    <style>
      :root { color-scheme: dark; --ink:#14252b; --paper:#eeeee3; --muted:#b8c8c9; --line:#53666a; }
      * { box-sizing:border-box; }
      body { margin:0; padding:32px 24px; background:var(--ink); color:var(--paper); font:16px/1.6 "Apple SD Gothic Neo",sans-serif; }
      main { max-width:1160px; margin:auto; }
      header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; }
      h1 { margin:0; font-size:23px; font-weight:500; }
      a { color:var(--paper); padding:10px 0; min-height:44px; }
      figure { position:relative; margin:0; aspect-ratio:8/5; overflow:hidden; background:var(--ink); }
      figure img { display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
      #after { clip-path:inset(0 50% 0 0); }
      #divider { position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--paper); pointer-events:none; }
      .label { position:absolute; top:16px; padding:5px 11px; background:var(--ink); font-size:13px; }
      .label:first-of-type { left:16px; }.label:last-of-type { right:16px; }
      .control { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; margin-top:15px; }
      input { width:100%; min-height:44px; accent-color:var(--paper); cursor:ew-resize; }
      input:focus-visible,a:focus-visible { outline:2px solid var(--paper); outline-offset:4px; }
      p { color:var(--muted); margin:18px 0 0; max-width:850px; }
      @media(max-width:600px) { body{padding:20px 14px}h1{font-size:20px}.control{gap:10px}header{gap:12px} }
    </style>
  </head>
  <body>
    <main>
      <header><h1>비가 머문 역 · 수정 전후</h1><a href="http://127.0.0.1:5174">작품 열기 ↗</a></header>
      <figure aria-label="같은 해상도로 촬영한 첫 버전과 보완 버전 비교">
        <img src="review-before.png" alt="첫 버전: 막힌 차창, 매끈한 처마와 과한 조명 반사" width="1440" height="900" />
        <img id="after" src="review-after.png" alt="보완 후: 객실이 보이는 차창, 골이 있는 처마, 자갈과 목재 재질" width="1440" height="900" />
        <div id="divider"></div>
        <span class="label">보완 후</span><span class="label">첫 버전</span>
      </figure>
      <div class="control"><span>첫 버전</span><input id="compare" type="range" min="0" max="100" value="50" aria-label="보완한 화면의 표시 비율" /><span>보완 후</span></div>
      <p>차창 뒤의 입체 구조, 촬영한 표면 재질, 조명과 반사의 거칠기를 보완했습니다. 기본 카메라 구도도 조정했습니다. 두 이미지는 브라우저의 실제 렌더를 1440×900으로 저장한 결과입니다.</p>
    </main>
    <script>
      const range=document.getElementById('compare');
      range.addEventListener('input',()=>{
        document.getElementById('after').style.clipPath=`inset(0 ${100-range.value}% 0 0)`;
        document.getElementById('divider').style.left=`${range.value}%`;
      });
    </script>
  </body>
</html>
